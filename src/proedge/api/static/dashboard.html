<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProEdge</title>
<style>
:root {
  --bg:     #08090f;
  --card:   #0f1120;
  --card2:  #131628;
  --border: #1c2040;
  --border2:#242848;
  --accent: #7c6dfa;
  --green:  #22c55e;
  --red:    #ef4444;
  --yellow: #f59e0b;
  --blue:   #3b82f6;
  --text:   #dde3f0;
  --muted:  #4a5070;
  --over:   #22c55e;
  --under:  #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ── Header ── */
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo svg { flex-shrink: 0; }
.model-pills { display: flex; gap: 6px; margin-left: 14px; }
.mpill {
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  border: 1px solid transparent; cursor: default;
}
.mpill.nba { border-color: rgba(201,162,39,.3); color: #c9a227; background: rgba(201,162,39,.07); }
.mpill.mlb { border-color: rgba(239,68,68,.3);  color: #ef4444; background: rgba(239,68,68,.07); }
.mpill.nfl { border-color: rgba(59,130,246,.3); color: #3b82f6; background: rgba(59,130,246,.07); }

#refresh-status {
  font-size: 11px; color: var(--muted); white-space: nowrap;
  display: none;
}

.scan-btn {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: opacity .15s;
}
.scan-btn:hover { opacity: .85; }
.scan-btn:disabled { opacity: .5; cursor: default; }

/* ── Main ── */
main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

/* ── Landing CTA ── */
#cta {
  text-align: center;
  padding: 80px 20px;
}
#cta h2 { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: -.02em; }
#cta p  { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
.cta-scan-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: opacity .15s;
}
.cta-scan-btn:hover { opacity: .85; }

/* ── Section header ── */
.sec-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.sec-title { font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .06em; }
.cnt-badge { background: var(--border2); color: var(--muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.sec-muted { font-size: 11px; color: var(--muted); margin-left: auto; }

/* ── P&L Banner ── */
#pnl-banner {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 20px;
  margin-bottom: 24px;
  display: none;
}
.pnl-inner { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.pnl-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
.pnl-total { font-size: 22px; font-weight: 800; }
.pnl-total.pos { color: var(--green); }
.pnl-total.neg { color: var(--red); }
.pnl-total.neu { color: var(--muted); }
.pnl-divider { width: 1px; height: 36px; background: var(--border); }
.pnl-sport { text-align: center; min-width: 70px; }
.pnl-sport-val { font-size: 13px; font-weight: 700; color: #fff; }
.pnl-sport-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pnl-note { font-size: 10px; color: var(--muted); margin-left: auto; }

/* ── Game cards ── */
.game-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .15s;
}
.game-card.open { border-color: var(--accent); }

.card-row {
  display: grid;
  grid-template-columns: 1fr 82px 120px 110px 130px 32px;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  gap: 12px;
}
@media (max-width: 700px) {
  .card-row { grid-template-columns: 1fr 82px 32px; }
  .card-row .hide-sm { display: none; }
}

.matchup-name { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; }
.matchup-meta { margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.sport-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.sport-dot.nba { background: #c9a227; }
.sport-dot.mlb { background: #ef4444; }
.sport-dot.nfl { background: #3b82f6; }
.sport-lbl { font-size: 11px; font-weight: 700; color: var(--muted); }

.line-block { text-align: center; }
.line-val { font-size: 20px; font-weight: 800; color: #fff; }
.line-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.line-move {
  font-size: 10px; font-weight: 700; margin-top: 1px;
  display: flex; align-items: center; justify-content: center; gap: 2px;
}
.line-move.up   { color: #f97316; }  /* orange = line rose (harder to bet over) */
.line-move.down { color: var(--green); }  /* green = line fell */

.dir-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dir-arrow { font-size: 18px; font-weight: 900; line-height: 1; }
.dir-arrow.over  { color: var(--over); }
.dir-arrow.under { color: var(--under); }
.dir-pct { font-size: 13px; font-weight: 700; }
.dir-pct.over  { color: var(--over); }
.dir-pct.under { color: var(--under); }

.conf-block { text-align: center; }
.conf-pct { font-size: 15px; font-weight: 700; color: #fff; }
.conf-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; margin-top: 3px; display: inline-block; }
.conf-label.weak     { background: rgba(74,80,112,.2); color: var(--muted); }
.conf-label.moderate { background: rgba(245,158,11,.12); color: var(--yellow); }
.conf-label.strong   { background: rgba(34,197,94,.12); color: var(--green); }
.conf-label.lock     { background: rgba(34,197,94,.2); color: #4ade80; }

.edge-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.edge-pill.over  { background: rgba(34,197,94,.12); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
.edge-pill.under { background: rgba(59,130,246,.12); color: var(--under); border: 1px solid rgba(59,130,246,.2); }
.edge-pill.none  { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; font-size: 11px; }

.chevron-btn {
  width: 28px; height: 28px;
  background: var(--border);
  border: none; border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
}
.chevron-btn:hover { background: var(--accent); color: #fff; }
.chevron-btn svg { transition: transform .2s; }
.game-card.open .chevron-btn svg { transform: rotate(180deg); }

/* ── Detail panel ── */
.card-detail {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--card2);
}
.card-detail.open { display: block; }

/* Primary call box */
.call-box {
  margin: 20px 20px 0;
  border-radius: 10px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.call-box.over  { background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.18); }
.call-box.under { background: rgba(59,130,246,.07); border: 1px solid rgba(59,130,246,.18); }
.call-box.none  { background: rgba(255,255,255,.02); border: 1px solid var(--border); }

.call-main { flex: 1; min-width: 200px; }
.call-verdict { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 4px; }
.call-verdict .over  { color: var(--over); }
.call-verdict .under { color: var(--under); }
.call-sub { font-size: 12px; color: var(--muted); }

.call-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.call-stat { text-align: center; }
.call-stat-val { font-size: 18px; font-weight: 700; color: #fff; }
.call-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.call-stat-val.over  { color: var(--over); }
.call-stat-val.under { color: var(--under); }

/* ── Threshold matrix ── */
.matrix-wrap { padding: 18px 20px 20px; }
.matrix-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 10px;
}
.matrix-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--border);
  text-align: center; white-space: nowrap;
}
.tbl th:first-child { text-align: left; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid rgba(28,32,64,.6); text-align: center; vertical-align: middle; }
.tbl td:first-child { text-align: left; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: rgba(255,255,255,.015); }
.tbl tr.implied td { background: rgba(245,158,11,.04); }
.tbl tr.best-over  td { background: rgba(34,197,94,.05); }
.tbl tr.best-under td { background: rgba(59,130,246,.05); }

.thresh-num { font-size: 13px; font-weight: 700; color: #fff; }
.tag { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 3px; letter-spacing: .04em; vertical-align: middle; margin-left: 3px; }
.tag-k  { background: rgba(245,158,11,.2); color: var(--yellow); }
.tag-illiq { background: rgba(74,80,112,.2); color: var(--muted); }

.ask-pill {
  display: inline-block; background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700;
  color: var(--text); font-family: monospace;
}

.prob-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: center; }
.prob-bar { height: 4px; border-radius: 2px; min-width: 2px; }
.prob-val { font-size: 12px; font-weight: 600; }

.ev-pos { color: var(--green); font-weight: 700; }
.ev-neg { color: var(--muted); }
.ev-dash { color: var(--muted); }

.action-cell { white-space: nowrap; }
.act-pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
  border-radius: 6px; font-size: 11px; font-weight: 700;
}
.act-pill.over  { background: rgba(34,197,94,.13); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
.act-pill.under { background: rgba(59,130,246,.13); color: var(--under); border: 1px solid rgba(59,130,246,.2); }
.act-no { color: var(--muted); font-size: 11px; }

/* ── History section ── */
#history-section { margin-top: 40px; }
.hist-row {
  display: grid;
  grid-template-columns: 1fr 70px 100px 90px 80px 80px;
  align-items: center;
  padding: 11px 14px;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.hist-match { font-weight: 600; color: var(--text); }
.hist-date  { color: var(--muted); font-size: 11px; }
.dir-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; }
.dir-tag.over  { color: var(--over); }
.dir-tag.under { color: var(--under); }
.result-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.result-tag.win     { background: rgba(34,197,94,.12); color: var(--green); }
.result-tag.loss    { background: rgba(239,68,68,.12);  color: var(--red); }
.result-tag.pending { background: var(--border); color: var(--muted); }
.pnl-tag { font-size: 11px; font-weight: 700; text-align: right; }
.pnl-tag.pos { color: var(--green); }
.pnl-tag.neg { color: var(--red); }
.pnl-tag.neu { color: var(--muted); }

/* ── Utility ── */
.spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }
.loading { color: var(--muted); font-size: 13px; padding: 22px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M3 3v18h18" stroke="#7c6dfa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M7 16l4-4 4 4 4-7" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ProEdge
  </div>
  <div class="model-pills" id="model-pills"></div>
  <span id="refresh-status"></span>
  <button class="scan-btn" id="scan-btn" onclick="runScan()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Scan Markets
  </button>
</header>

<main>

  <!-- Landing / Scan results -->
  <div id="scan-section">
    <div id="cta">
      <h2>Find Today's Edges</h2>
      <p>Scan live Kalshi prediction markets and score them against the model.</p>
      <button class="cta-scan-btn" onclick="runScan()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Scan Markets
      </button>
    </div>
    <div id="scan-results" style="display:none">
      <div class="sec-hd">
        <span class="sec-title">Live Markets</span>
        <span class="cnt-badge" id="scan-cnt">0</span>
        <span class="sec-muted" id="scan-ts"></span>
      </div>
      <!-- P&L Banner (shown after first scan if settled predictions exist) -->
      <div id="pnl-banner"></div>
      <div id="scan-list"></div>
    </div>
  </div>

  <!-- History -->
  <div id="history-section" style="display:none">
    <div class="sec-hd">
      <span class="sec-title">Today's Predictions</span>
      <span class="cnt-badge" id="hist-cnt">0</span>
      <button onclick="autoSettle()" id="settle-btn"
        style="margin-left:auto;font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;">
        Auto-Settle
      </button>
    </div>
    <div id="hist-list"></div>
  </div>

</main>

<script>
const API_KEY = '';

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'X-API-Key': API_KEY, 'Content-Type': 'application/json' }, ...opts });
  return r.ok ? r.json() : null;
}

/* ── Helpers ── */
function pct(v)  { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }
function f1(v)   { return v == null ? '—' : Number(v).toFixed(1); }
function ev(v)   { return v == null ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
function money(v){ return v == null ? '—' : (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2); }

function confLabel(c) {
  if (c >= .40) return { label: 'Lock',     cls: 'lock' };
  if (c >= .28) return { label: 'Strong',   cls: 'strong' };
  if (c >= .14) return { label: 'Moderate', cls: 'moderate' };
  return               { label: 'Weak',     cls: 'weak' };
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return `${Math.round(s)}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

const CHV = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ── Model pills ── */
async function loadModelPills() {
  const [perf, live] = await Promise.all([
    api('/models/performance'),
    api('/predictions/performance'),
  ]);

  const latestModels = {};
  if (perf && perf.length) {
    perf.forEach(m => {
      if (!latestModels[m.sport] || m.trained_at > latestModels[m.sport].trained_at)
        latestModels[m.sport] = m;
    });
  }

  const el = document.getElementById('model-pills');
  const sports = ['nba', 'mlb', 'nfl'];
  el.innerHTML = sports.map(sport => {
    const m = latestModels[sport];
    const trainAcc = m && m.accuracy != null ? (m.accuracy * 100).toFixed(0) + '% train' : null;
    const liveData = live && live[sport];
    const liveStr = liveData && liveData.total_settled > 0
      ? `${liveData.wins}/${liveData.total_settled} live`
      : null;
    const label = liveStr || trainAcc || '—';
    return `<span class="mpill ${sport}">${sport.toUpperCase()} ${label}</span>`;
  }).join('');
}

/* ── Auto-refresh ── */
const REFRESH_INTERVAL = 300; // 5 minutes
let _refreshSecondsLeft = 0;
let _refreshTimer = null;

function startAutoRefresh() {
  clearInterval(_refreshTimer);
  _refreshSecondsLeft = REFRESH_INTERVAL;
  const status = document.getElementById('refresh-status');
  status.style.display = '';
  _refreshTimer = setInterval(() => {
    _refreshSecondsLeft--;
    if (_refreshSecondsLeft <= 0) {
      runScan(true);
      _refreshSecondsLeft = REFRESH_INTERVAL;
    }
    const m = Math.floor(_refreshSecondsLeft / 60);
    const s = (_refreshSecondsLeft % 60).toString().padStart(2, '0');
    status.textContent = `Auto-refresh in ${m}:${s}`;
  }, 1000);
}

/* ── P&L banner ── */
async function loadPnlBanner() {
  const data = await api('/predictions/performance');
  if (!data) return;

  const sports = ['nba', 'mlb', 'nfl'];
  const totalPnl = sports.reduce((sum, s) => sum + (data[s]?.pnl || 0), 0);
  const totalSettled = sports.reduce((sum, s) => sum + (data[s]?.total_settled || 0), 0);

  if (totalSettled === 0) return;

  const pnlCls = totalPnl > 0 ? 'pos' : totalPnl < 0 ? 'neg' : 'neu';
  const sportHtml = sports.map(s => {
    const d = data[s];
    if (!d || d.total_settled === 0) return '';
    const pnlCls = d.pnl > 0 ? 'pos' : d.pnl < 0 ? 'neg' : 'neu';
    const rate = d.hit_rate != null ? (d.hit_rate * 100).toFixed(0) + '%' : '—';
    return `
      <div class="pnl-sport">
        <div class="pnl-label">${s.toUpperCase()}</div>
        <div class="pnl-sport-val" style="color:${d.pnl > 0 ? 'var(--green)' : d.pnl < 0 ? 'var(--red)' : '#fff'}">${money(d.pnl)}</div>
        <div class="pnl-sport-sub">${d.wins}/${d.total_settled} · ${rate}</div>
      </div>`;
  }).filter(Boolean).join('<div class="pnl-divider"></div>');

  const banner = document.getElementById('pnl-banner');
  banner.style.display = '';
  banner.innerHTML = `
    <div class="pnl-inner">
      <div>
        <div class="pnl-label">Paper P&amp;L</div>
        <div class="pnl-total ${pnlCls}">${money(totalPnl)}</div>
      </div>
      <div class="pnl-divider"></div>
      ${sportHtml}
      <div class="pnl-note">$100/bet · -110 odds · ${totalSettled} settled</div>
    </div>`;
}

/* ── SCAN ── */
let _scans = [];

async function runScan(isAuto = false) {
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Scanning…`;

  document.getElementById('cta').style.display = 'none';
  document.getElementById('scan-results').style.display = '';
  if (!isAuto) {
    document.getElementById('scan-list').innerHTML = `<div class="loading"><span class="spinner"></span>Querying Kalshi markets and scoring against model…</div>`;
  }

  const data = await api('/predictions/scan', {
    method: 'POST',
    body: JSON.stringify({ sports: ['nba', 'mlb', 'nfl'] }),
  });

  btn.disabled = false;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Scan Markets`;

  if (!data) {
    document.getElementById('scan-list').innerHTML = `<div class="empty" style="color:var(--red)">Scan failed — check server.</div>`;
    return;
  }

  _scans = (data.results || []).sort((a, b) => {
    const ae = a.best_edge ?? -99, be = b.best_edge ?? -99;
    return be - ae;
  });

  document.getElementById('scan-cnt').textContent = _scans.length;
  document.getElementById('scan-ts').textContent = 'scanned ' + timeAgo(data.scanned_at);

  // Re-render cards (preserve open state if auto-refresh)
  const openCards = new Set();
  if (isAuto) {
    document.querySelectorAll('.game-card.open').forEach(el => {
      openCards.add(el.id);
    });
  }

  document.getElementById('scan-list').innerHTML = _scans.length
    ? _scans.map((r, i) => buildCard(r, i)).join('')
    : `<div class="empty">No open Kalshi markets found. Try again closer to game time.</div>`;

  // Re-open cards that were open before auto-refresh
  if (isAuto) {
    openCards.forEach(id => {
      const idx = parseInt(id.replace('gc-', ''));
      if (!isNaN(idx)) {
        const card = document.getElementById(id);
        const detail = document.getElementById(`gd-${idx}`);
        if (card && detail) {
          card.classList.add('open');
          detail.classList.add('open');
          detail.dataset.loaded = '1';
          detail.innerHTML = buildDetail(_scans[idx]);
        }
      }
    });
  }

  loadHistory();
  loadPnlBanner();
  loadModelPills();
  startAutoRefresh();
}

/* ── Build scan card ── */
function buildCard(r, i) {
  const dir   = r.predicted_direction;
  const prob  = dir === 'over' ? r.model_prob_over : r.model_prob_under;
  const conf  = confLabel(r.confidence);
  const hasEdge = r.best_bet != null && r.best_edge != null;

  const edgeHtml = hasEdge
    ? `<span class="edge-pill ${r.best_bet}">
         ${r.best_bet === 'over' ? '▲' : '▼'} ${r.best_bet.toUpperCase()} ${r.best_threshold}
         <span style="font-size:10px;opacity:.75">+${(r.best_edge*100).toFixed(1)}%</span>
       </span>`
    : `<span class="edge-pill none">No edge</span>`;

  // Line movement indicator
  const mv = r.line_movement;
  const mvHtml = mv != null && Math.abs(mv) >= 0.05
    ? `<div class="line-move ${mv > 0 ? 'up' : 'down'}">${mv > 0 ? '▲' : '▼'} ${Math.abs(mv).toFixed(1)}</div>`
    : '';

  return `<div class="game-card" id="gc-${i}">
    <div class="card-row" onclick="toggleCard(${i})">
      <div>
        <div class="matchup-name">${r.home_team} <span style="color:var(--muted);font-weight:400">vs</span> ${r.away_team}</div>
        <div class="matchup-meta">
          <span class="sport-dot ${r.sport}"></span>
          <span class="sport-lbl">${r.sport.toUpperCase()}</span>
        </div>
      </div>
      <div class="line-block">
        <div class="line-val">${f1(r.kalshi_implied_line)}</div>
        ${mvHtml}
        <div class="line-lbl">Line</div>
      </div>
      <div class="dir-block hide-sm">
        <span class="dir-arrow ${dir}">${dir === 'over' ? '▲' : '▼'}</span>
        <span class="dir-pct ${dir}">${pct(prob)}</span>
      </div>
      <div class="conf-block hide-sm">
        <div class="conf-pct">${Math.round(r.confidence * 100)}%</div>
        <span class="conf-label ${conf.cls}">${conf.label}</span>
      </div>
      <div class="hide-sm">${edgeHtml}</div>
      <button class="chevron-btn">${CHV}</button>
    </div>
    <div class="card-detail" id="gd-${i}">
      <div class="loading"><span class="spinner"></span>Loading…</div>
    </div>
  </div>`;
}

function toggleCard(i) {
  const card   = document.getElementById(`gc-${i}`);
  const detail = document.getElementById(`gd-${i}`);
  const isOpen = card.classList.contains('open');
  if (isOpen) { card.classList.remove('open'); detail.classList.remove('open'); return; }
  card.classList.add('open');
  detail.classList.add('open');
  if (detail.dataset.loaded) return;
  detail.dataset.loaded = '1';
  detail.innerHTML = buildDetail(_scans[i]);
}

/* ── Build detail panel ── */
function buildDetail(r) {
  const dir    = r.predicted_direction;
  const prob   = dir === 'over' ? r.model_prob_over : r.model_prob_under;
  const hasEdge = r.best_bet != null && r.best_edge != null;

  /* Primary call box */
  const callBoxCls = hasEdge ? r.best_bet : 'none';
  let callVerdict, callSub;

  if (hasEdge) {
    const side = r.best_bet === 'over' ? '▲ OVER' : '▼ UNDER';
    callVerdict = `<span class="${r.best_bet}">${side}</span> ${r.best_threshold}`;
    callSub = `on Kalshi · ${(r.best_edge * 100).toFixed(1)}% EV edge`;
  } else {
    callVerdict = `<span style="color:var(--muted)">No edge</span>`;
    callSub = 'Market priced fairly — skip this game';
  }

  // Line movement context in call box subtitle
  const mv = r.line_movement;
  const mvNote = mv != null && Math.abs(mv) >= 0.05
    ? ` · line ${mv > 0 ? '▲' : '▼'} ${Math.abs(mv).toFixed(1)} since first seen`
    : '';

  const callBox = `
    <div class="call-box ${callBoxCls}">
      <div class="call-main">
        <div class="call-verdict">${callVerdict}</div>
        <div class="call-sub">${callSub}${mvNote}</div>
      </div>
      <div class="call-stats">
        <div class="call-stat">
          <div class="call-stat-val over">${pct(r.model_prob_over)}</div>
          <div class="call-stat-lbl">Over</div>
        </div>
        <div class="call-stat">
          <div class="call-stat-val under">${pct(r.model_prob_under)}</div>
          <div class="call-stat-lbl">Under</div>
        </div>
        <div class="call-stat">
          <div class="call-stat-val">${Math.round(r.confidence * 100)}%</div>
          <div class="call-stat-lbl">Conf.</div>
        </div>
        <div class="call-stat">
          <div class="call-stat-val">${f1(r.kalshi_implied_line)}</div>
          <div class="call-stat-lbl">Kalshi</div>
        </div>
      </div>
    </div>`;

  /* Threshold matrix */
  const thr = r.thresholds || [];
  let matrixHtml = '';
  if (thr.length) {
    const implied = r.kalshi_implied_line;
    const nearestIdx = implied != null
      ? thr.reduce((best, t, i) =>
          Math.abs(t.threshold - implied) < Math.abs(thr[best].threshold - implied) ? i : best, 0)
      : -1;

    const rows = thr.map((t, idx) => {
      const illiquid   = t.market_prob <= 0.12 || t.market_prob >= 0.88;
      const isNearest  = idx === nearestIdx;
      const outOfRange = implied != null && Math.abs(t.threshold - implied) > 3.0;
      const isBestO    = t.best_bet === 'over';
      const isBestU    = t.best_bet === 'under';

      let rowCls = '';
      if (isBestO) rowCls = 'best-over';
      else if (isBestU) rowCls = 'best-under';
      else if (isNearest) rowCls = 'implied';

      const mpBarW = Math.round(Math.min(t.market_prob * 100, 56));
      const mpColor = t.market_prob >= 0.5 ? 'var(--over)' : 'var(--under)';
      const mdBarW  = t.model_prob != null ? Math.round(Math.min(t.model_prob * 100, 56)) : 0;
      const dimStyle = outOfRange ? 'opacity:.45' : '';

      const actionHtml = illiquid
        ? `<span class="act-no">Illiquid</span>`
        : outOfRange
          ? `<span class="act-no" title="Outside ±3 of implied line — model unreliable here">—</span>`
          : t.best_bet
            ? `<span class="act-pill ${t.best_bet}">${t.best_bet === 'over' ? '▲' : '▼'} ${t.best_bet.toUpperCase()} ${t.edge ? `<span style="font-size:10px;opacity:.75">+${(t.edge*100).toFixed(1)}%</span>` : ''}</span>`
            : `<span class="act-no">No edge</span>`;

      return `<tr class="${rowCls}" style="${dimStyle}">
        <td>
          <span class="thresh-num">${t.threshold}</span>
          ${isNearest ? '<span class="tag tag-k">50%</span>' : ''}
          ${illiquid  ? '<span class="tag tag-illiq">illiq</span>' : ''}
        </td>
        <td><span class="ask-pill">${(t.yes_ask * 100).toFixed(0)}¢</span></td>
        <td><span class="ask-pill">${(t.no_ask * 100).toFixed(0)}¢</span></td>
        <td>
          <div class="prob-bar-wrap">
            <div class="prob-bar" style="width:${mpBarW}px;background:${mpColor}"></div>
            <span class="prob-val">${(t.market_prob * 100).toFixed(0)}%</span>
          </div>
        </td>
        <td>
          ${t.model_prob != null
            ? `<div class="prob-bar-wrap">
                 <div class="prob-bar" style="width:${mdBarW}px;background:var(--accent)"></div>
                 <span class="prob-val">${(t.model_prob * 100).toFixed(0)}%</span>
               </div>`
            : '<span class="ev-dash">—</span>'}
        </td>
        <td class="${t.ev_yes > 0 ? 'ev-pos' : 'ev-neg'}">${ev(t.ev_yes)}</td>
        <td class="${t.ev_no  > 0 ? 'ev-pos' : 'ev-neg'}">${ev(t.ev_no)}</td>
        <td class="action-cell">${actionHtml}</td>
      </tr>`;
    }).join('');

    matrixHtml = `
      <div class="matrix-wrap">
        <div class="matrix-title">Kalshi Threshold Matrix — ${r.home_team} vs ${r.away_team}</div>
        <div class="matrix-scroll">
          <table class="tbl">
            <thead><tr>
              <th>Line</th>
              <th>Over Ask</th>
              <th>Under Ask</th>
              <th>Market %</th>
              <th>Model %</th>
              <th>EV Over</th>
              <th>EV Under</th>
              <th>Action</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style="margin-top:8px;font-size:10px;color:var(--muted)">
          <span style="color:var(--yellow)">50%</span> = nearest Kalshi threshold to fair-value line ·
          Illiquid = market outside 12–88% range ·
          Dimmed rows = outside ±3 of implied line (model unreliable)
        </div>
      </div>`;
  } else {
    matrixHtml = `<div style="padding:16px 20px;font-size:12px;color:var(--muted)">No Kalshi threshold data for this game.</div>`;
  }

  return callBox + matrixHtml;
}

/* ── History ── */
async function loadHistory() {
  const preds = await api('/predictions/recent?limit=100&sort_by=newest');
  if (!preds || !preds.length) return;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayPreds = preds.filter(p => p.predicted_at && new Date(p.predicted_at) >= today);
  if (!todayPreds.length) return;

  document.getElementById('history-section').style.display = '';
  document.getElementById('hist-cnt').textContent = todayPreds.length;

  document.getElementById('hist-list').innerHTML = todayPreds.map(p => {
    const dir = p.predicted_direction;
    const conf = confLabel(p.confidence);
    const isSettled = p.is_correct != null;
    const result = !isSettled
      ? '<span class="result-tag pending">Pending</span>'
      : p.is_correct
        ? '<span class="result-tag win">✓ Win</span>'
        : '<span class="result-tag loss">✗ Loss</span>';

    // Hypothetical P&L at -110 odds
    let pnlHtml = '<span class="pnl-tag neu">—</span>';
    if (isSettled) {
      const gain = p.is_correct ? 90.91 : -100;
      const cls = gain > 0 ? 'pos' : 'neg';
      pnlHtml = `<span class="pnl-tag ${cls}">${gain > 0 ? '+' : ''}$${Math.abs(gain).toFixed(2)}</span>`;
    }

    return `<div class="hist-row">
      <div>
        <div class="hist-match">${p.home_team} vs ${p.away_team}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${(p.sport||'').toUpperCase()} · ${timeAgo(p.predicted_at)}</div>
      </div>
      <div style="text-align:center;font-size:13px;font-weight:700;color:#fff">${f1(p.total_line)}</div>
      <div class="dir-tag ${dir}">${dir === 'over' ? '▲' : '▼'} ${dir.toUpperCase()} ${pct(dir === 'over' ? p.prob_over : p.prob_under)}</div>
      <div style="text-align:center"><span class="conf-label ${conf.cls}">${conf.label}</span></div>
      <div style="text-align:right">${result}</div>
      <div style="text-align:right">${pnlHtml}</div>
    </div>`;
  }).join('');
}

/* ── Auto-settle ── */
async function autoSettle() {
  const btn = document.getElementById('settle-btn');
  btn.textContent = 'Settling…';
  btn.disabled = true;
  const res = await api('/predictions/settle/auto', { method: 'POST' });
  btn.disabled = false;
  if (res) {
    btn.textContent = res.error
      ? 'DB offline'
      : `Settled ${res.settled}`;
    if (res.settled > 0) {
      loadHistory();
      loadPnlBanner();
      loadModelPills();
    }
  } else {
    btn.textContent = 'Failed';
  }
  setTimeout(() => { btn.textContent = 'Auto-Settle'; }, 3000);
}

/* ── Init ── */
loadModelPills();
</script>
